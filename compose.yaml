services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaggle_app
    ipc: host
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/kaggle
    working_dir: /kaggle
    env_file:
      - .env
    tty: true
    stdin_open: true
    command: /bin/bash